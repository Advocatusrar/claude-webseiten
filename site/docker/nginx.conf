# Web server for the built site (dist/) inside the Docker image.
# Runs behind Traefik, which terminates TLS and adds HSTS. Included in the http
# context of nginx (conf.d/default.conf of the nginx-unprivileged image).

server_tokens off;

# Fingerprinted build assets never change, pages must be revalidated.
map $uri $cache_control {
    /healthz    "no-store";
    ~/_astro/   "public, max-age=31536000, immutable";
    ~\.html$    "no-cache";
    ~/$         "no-cache";
    default     "public, max-age=3600";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects (e.g. /blog -> /blog/), correct behind the proxy.
    absolute_redirect off;

    # No access log: the site does not store visitor IP addresses (see Datenschutzerklärung).
    access_log off;
    # Missing files are no error worth logging (the line would contain the client IP).
    log_not_found off;

    include /etc/nginx/mime.types;
    types {
        text/markdown md;
    }
    charset utf-8;
    charset_types text/plain text/markdown text/css text/xml application/javascript application/xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/markdown text/css text/xml application/javascript application/xml application/json image/svg+xml;

    # Security headers, also on error pages. The site loads nothing from other servers;
    # 'unsafe-inline' for styles is needed for style attributes in inline SVG.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $cache_control always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # For the container health check and the deploy script.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
