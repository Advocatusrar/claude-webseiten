# CI/CD for the website in site/.
#
#   Pull request:  quality -> image (built once) -> browser tests against the image + security scan
#   Push to main:  the same, then publish the tested image to GHCR and deploy it to the server
#
# Only main is deployed, and main only accepts pull requests with green checks
# (branch ruleset, see docs/ci-cd.md). Publishing and deploying stay off until the
# repository variable DEPLOY_ENABLED is "true"; then CHECK_LIVE=1 also turns placeholders
# (Impressum, example.org) into build errors.
#
# Actions are pinned to commit SHAs (tags can be moved, see the trivy-action incident of
# March 2026). Dependabot keeps the SHAs up to date.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LEFTHOOK: '0'
  RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
  SITE_URL: ${{ vars.SITE_URL || 'https://www.example.org' }}
  IMAGE_TAR: /tmp/website-image.tar
  IMAGE_LOCAL: website:ci

jobs:
  quality:
    name: Quality (format, types, unit tests, build, checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      # unit tests, astro build, check-site (links, external resources, JSON-LD, drafts,
      # placeholders), html-validate
      - run: npm test

  image:
    name: Build Docker image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: site
          tags: ${{ env.IMAGE_LOCAL }}
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
            CHECK_LIVE=${{ env.RELEASE == 'true' && '1' || '0' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ env.IMAGE_TAR }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-image
          path: ${{ env.IMAGE_TAR }}
          retention-days: 3

  e2e:
    name: Browser tests against the image
    needs: image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-image
          path: /tmp
      - name: Start the image
        run: |
          docker load --input "$IMAGE_TAR"
          docker run --detach --name website --publish 8080:8080 --read-only --tmpfs /tmp "$IMAGE_LOCAL"
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          docker logs website
          exit 1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7

  scan:
    name: Security scan of the image
    needs: image
    runs-on: ubuntu-latest
    # No secrets and no write permissions in this job.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-image
          path: /tmp
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ env.IMAGE_TAR }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish image
    needs: [quality, e2e, scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-image
          path: /tmp
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushes exactly the image that was tested, tagged with the commit and as "latest".
      - id: push
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}/website"
          docker load --input "$IMAGE_TAR"
          docker tag "$IMAGE_LOCAL" "$repo:sha-$GITHUB_SHA"
          docker tag "$IMAGE_LOCAL" "$repo:latest"
          docker push "$repo:sha-$GITHUB_SHA"
          docker push "$repo:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:sha-$GITHUB_SHA")
          echo "image=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production
    needs: publish
    runs-on: ubuntu-latest
    # Approval, secrets and URL of the environment are set in Settings -> Environments.
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # The deploy key may only run deploy.sh on the server (forced command in
      # authorized_keys), which gets the image reference as its only argument.
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" "$IMAGE"
      - name: Check the live site
        env:
          SITE: ${{ vars.SITE_URL }}
        run: |
          curl --fail --silent --show-error --max-time 10 "$SITE/healthz"
          curl --fail --silent --show-error --max-time 10 --output /dev/null "$SITE/"
